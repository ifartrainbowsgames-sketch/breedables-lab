name: Wiki link check

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".lychee.toml"
      - ".github/workflows/wiki-links.yml"
  push:
    branches:
      - main
      - feature/studio-librarian-v1
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".lychee.toml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link check (docs)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --verbose --no-progress './docs/**/*.md'
          fail: true

  slack:
    needs: lychee
    if: always()
    uses: ./.github/workflows/slack-notify.yml
    with:
      title: "Wiki link check (lychee)"
      conclusion: ${{ needs.lychee.result }}
      notify_on: failure
      details: "Broken or unreachable links in `docs/**/*.md`. Run locally: `lychee --config .lychee.toml './docs/**/*.md'`"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_NOTIFY_CHANNEL: ${{ secrets.SLACK_NOTIFY_CHANNEL }}

name: Librarian tests

on:
  push:
    paths:
      - "tools/librarian/**"
      - ".github/workflows/librarian-tests.yml"
  pull_request:
    paths:
      - "tools/librarian/**"
      - ".github/workflows/librarian-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/librarian

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

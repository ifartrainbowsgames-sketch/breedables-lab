[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "breedables-studio-librarian"
version = "0.1.0"
description = "Deterministic research intake, validation, indexing, and Slack lookup for Breedables Studio."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "slack-bolt>=1.21,<2",
  "slack-sdk>=3.33,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
breedables-librarian = "librarian.cli:main"
breedables-slack = "librarian.slack_app:main"

[tool.setuptools]
packages = ["librarian"]

[tool.pytest.ini_options]
testpaths = ["tests"]

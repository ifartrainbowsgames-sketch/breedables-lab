site_name: Breedables Lab
site_description: Open-source-first production studio for Second Life breedables
site_url: https://ifartrainbowsgames-sketch.github.io/breedables-lab/
repo_url: https://github.com/ifartrainbowsgames-sketch/breedables-lab
repo_name: breedables-lab
edit_uri: edit/feature/studio-librarian-v1/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Academy:
      - Overview: academy/overview.md
      - Production line: academy/production-line.md
      - Software & Tools:
          - Overview: academy/software/index.md
          - Build plan: academy/software/build-plan.md
          - Blender Foundations:
              - Path overview: academy/software/blender/index.md
              - B01 Install & setup: academy/software/blender/b01-install-setup.md
              - B02 Interface & navigation: academy/software/blender/b02-interface-navigation.md
              - B03 Mesh modeling: academy/software/blender/b03-mesh-modeling.md
              - B04 Sculpting basics: academy/software/blender/b04-sculpting.md
              - B05 Retopology: academy/software/blender/b05-retopology.md
              - B06 UV unwrapping: academy/software/blender/b06-uv-unwrapping.md
              - B07 Texture painting & PBR: academy/software/blender/b07-texture-painting-pbr.md
              - B08 Rigging & weight painting: academy/software/blender/b08-rigging-weight-painting.md
              - B09 Basic animation: academy/software/blender/b09-animation.md
              - B10 Export to Second Life: academy/software/blender/b10-export-to-sl.md
          - Add-on catalog: academy/software/addon-catalog.md
          - Software index: academy/software/software-index.md
      - Tracks:
          - A01 Organic PBR: academy/tracks/a01-organic-pbr.md
          - A02 Layered textures: academy/tracks/a02-layered-textures.md
          - A03 Retopology: academy/tracks/a03-retopology.md
          - A04 Rig + animation: academy/tracks/a04-rig-animation.md
          - A05 SL fixture: academy/tracks/a05-sl-fixture.md
      - Resources:
          - Training videos: academy/resources/videos.md
          - Tutorial arsenal: academy/resources/tutorials.md
          - Official docs: academy/resources/official-docs.md
  - Studio:
      - Roadmap: studio-roadmap.md
      - Wiki-first strategy: studio/wiki-first-strategy.md
      - Channel map: studio/channel-map.md
      - Content requirements: studio/channel-content-requirements.md
      - Tools registry:
          - Overview: production/tools/index.md
          - Blender: production/tools/blender.md
          - Material Maker: production/tools/material-maker.md
          - Ucupaint: production/tools/ucupaint.md
          - TripoSR: production/tools/triposr.md
          - RetopoFlow: production/tools/retopoflow.md
          - Poly Haven: production/tools/poly-haven.md
          - ambientCG: production/tools/ambientcg.md
          - Research candidates: production/tools/research-candidates.md
      - Experiments: production/experiments.md
      - Promotion rules: production/promotion-rules.md
      - Decision model: production/decision-model.md
  - Second Life: secondlife/platform-baseline.md
  - Research:
      - Phase 0 survey: research/phase-0-survey.md
      - Wiki concept audit: research/wiki-concept-audit.md
      - Breedables market & design study: research/breedables-market-study.md
      - Breedables case studies: research/breedables-case-studies.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ifartrainbowsgames-sketch/breedables-lab
